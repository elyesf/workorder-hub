name: Screenshots

# Starts the real app with Docker Compose, takes screenshots with Playwright
# and commits them to docs/screenshots so the README always shows the current UI.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.yml"
      - "e2e/**"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the app
        run: docker compose up --build -d

      - name: Wait until API and frontend respond
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/actuator/health | grep -q UP && curl -fs http://localhost:4200 > /dev/null; then
              echo "App is up"; exit 0
            fi
            sleep 5
          done
          echo "App did not start in time"; docker compose logs; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Take screenshots
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
          npm run screenshots

      - name: Commit screenshots if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "Update screenshots"
            git push
          fi

      - name: Show logs on failure
        if: failure()
        run: docker compose logs
