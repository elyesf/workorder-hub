<section class="card narrow">
  <h1>{{ mode() === 'login' ? 'Log in' : 'Create account' }}</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (mode() === 'register') {
      <label>
        Name
        <input formControlName="displayName" autocomplete="name" />
      </label>
    }

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="field-error">Enter a valid email address.</small>
      }
    </label>

    <label>
      Password
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="field-error">At least 8 characters.</small>
      }
    </label>

    @if (error()) {
      <p class="alert" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="primary" [disabled]="busy()">
      {{ mode() === 'login' ? 'Log in' : 'Create account' }}
    </button>
  </form>

  <p class="muted">
    {{ mode() === 'login' ? 'No account yet?' : 'Already registered?' }}
    <button type="button" class="link" (click)="toggleMode()">
      {{ mode() === 'login' ? 'Create one' : 'Log in' }}
    </button>
  </p>
  <p class="muted small">Demo account (when demo data is on): demo&#64;workorderhub.dev / demo12345</p>
</section>
